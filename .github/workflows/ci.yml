name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Playwright arranca el servidor en modo práctica (MODO_PRACTICA=1) y ejecuta las pruebas de contrato.
      # Con CI=true no reutiliza un servidor ya levantado.
      - name: Contract tests
        run: npm test
        env:
          CI: true
